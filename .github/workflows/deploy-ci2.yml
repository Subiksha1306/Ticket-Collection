name: Deploy ci-ticket-tool-impactx to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to deploy
        required: false
        default: main

concurrency:
  group: deploy-ci-ticket-tool-impactx
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: ci-ticket-tool-impactx
  REGISTRY: ghcr.io
  IMAGE_NAME: techxle/ticket-tool-impactx
  NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL || secrets.NEXTAUTH_URL || 'https://ci-ticket-tool-impactx.azurewebsites.net' }}

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Validate deployment settings
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          required=(AZURE_CREDENTIALS GHCR_PAT)
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub environment ci secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate Azure App Service settings
        uses: azure/CLI@v2
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }}
        with:
          inlineScript: |
            set -euo pipefail
            RG="${AZURE_RESOURCE_GROUP:-$(az webapp list --query "[?name=='$AZURE_WEBAPP_NAME'].resourceGroup | [0]" -o tsv)}"
            if [[ -z "$RG" ]]; then
              echo "Could not find Azure Web App '$AZURE_WEBAPP_NAME'. Set AZURE_RESOURCE_GROUP or verify AZURE_CREDENTIALS." >&2
              exit 1
            fi

            setting_names=$(az webapp config appsettings list \
              --name "$AZURE_WEBAPP_NAME" \
              --resource-group "$RG" \
              --query "[?value != ''].name" -o tsv)
            required=(
              DATABASE_URL GROQ_API_KEY NEXTAUTH_SECRET
              AZURE_AD_CLIENT_ID AZURE_AD_CLIENT_SECRET AZURE_AD_TENANT_ID
              SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY
            )
            missing=()
            for name in "${required[@]}"; do
              if ! grep -Fxq "$name" <<< "$setting_names"; then
                missing+=("$name")
              fi
            done
            if (( ${#missing[@]} > 0 )); then
              printf 'Configure these non-empty settings in Azure App Service > Configuration > Application settings: %s\n' "${missing[*]}" >&2
              exit 1
            fi

      - name: Resolve checked-out commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ steps.source.outputs.sha }}
            type=raw,value=ci,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure and deploy Azure Web App container
        uses: azure/CLI@v2
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.source.outputs.sha }}
        with:
          inlineScript: |
            set -euo pipefail
            RG="${AZURE_RESOURCE_GROUP:-$(az webapp list --query "[?name=='$AZURE_WEBAPP_NAME'].resourceGroup | [0]" -o tsv)}"
            if [[ -z "$RG" ]]; then
              echo "Could not find Azure Web App '$AZURE_WEBAPP_NAME'. Set AZURE_RESOURCE_GROUP or verify AZURE_CREDENTIALS." >&2
              exit 1
            fi

            az webapp config appsettings set \
              --name "$AZURE_WEBAPP_NAME" \
              --resource-group "$RG" \
              --settings \
                WEBSITES_PORT=3000 \
                PORT=3000 \
                NODE_ENV=production \
                WEBSITE_WARMUP_PATH=/login \
                WEBSITE_WARMUP_STATUSES=200 \
                WEBSITES_CONTAINER_START_TIME_LIMIT=600 \
                "NEXTAUTH_URL=$NEXTAUTH_URL" \
              --output none

            az webapp config container set \
              --name "$AZURE_WEBAPP_NAME" \
              --resource-group "$RG" \
              --container-image-name "$IMAGE" \
              --container-registry-url "https://ghcr.io" \
              --container-registry-user "$GHCR_USERNAME" \
              --container-registry-password "$GHCR_PAT" \
              --output none

            az webapp restart \
              --name "$AZURE_WEBAPP_NAME" \
              --resource-group "$RG" \
              --output none

      - name: Verify deployed app responds
        env:
          APP_URL: ${{ env.NEXTAUTH_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 18 --retry-delay 10 --retry-all-errors --max-time 20 \
            --output /dev/null "${APP_URL%/}/login"
          echo "Deployment healthy at ${APP_URL%/}"
