name: Deploy ci-ticket-tool-impactx — CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to deploy (defaults to main)'
        required: false
        default: 'main'

env:
  AZURE_WEBAPP_NAME: ci-ticket-tool-impactx
  REGISTRY: ghcr.io
  IMAGE_NAME: techxle/ticket-tool-impactx
  IMAGE_TAG: ci
  APP_PORT: ${{ vars.PORT || '3000' }}

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Normalise image name to lowercase
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sync package-lock.json
        if: hashFiles('package.json') != ''
        run: |
          npm install --legacy-peer-deps --package-lock-only 2>/dev/null || \
          npm install --legacy-peer-deps 2>/dev/null || true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Push environment variables to Azure App Settings
        uses: azure/CLI@v2
        with:
          azcliversion: 2.68.0
          inlineScript: |
            RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
            if [ -z "$RG" ]; then
              RG=$(az webapp list --query "[?name=='${{ env.AZURE_WEBAPP_NAME }}'].resourceGroup" -o tsv)
            fi
            az webapp config appsettings set \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "$RG" \
              --settings \
                WEBSITES_PORT="${{ env.APP_PORT }}" \
                PORT="${{ env.APP_PORT }}" \
                NODE_ENV="production" \
                DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                DIRECT_URL="${{ secrets.DIRECT_URL }}" \
                JWT_SECRET="${{ secrets.JWT_SECRET }}" \
                NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}" \
                NEXTAUTH_URL="${{ secrets.NEXTAUTH_URL || 'https://ci-ticket-tool-impactx.azurewebsites.net' }}"

      - name: Configure GHCR pull credentials on Azure Web App
        uses: azure/CLI@v2
        with:
          azcliversion: 2.68.0
          inlineScript: |
            RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
            if [ -z "$RG" ]; then
              RG=$(az webapp list --query "[?name=='${{ env.AZURE_WEBAPP_NAME }}'].resourceGroup" -o tsv)
            fi
            GHCR_PAT="${{ secrets.GHCR_PAT }}"
            if [ -n "$GHCR_PAT" ]; then
              az webapp config container set \
                --name "${{ env.AZURE_WEBAPP_NAME }}" \
                --resource-group "$RG" \
                --container-image-name "ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
                --container-registry-url "https://ghcr.io" \
                --container-registry-user "${{ github.actor }}" \
                --container-registry-password "$GHCR_PAT"
            else
              az webapp config container set \
                --name "${{ env.AZURE_WEBAPP_NAME }}" \
                --resource-group "$RG" \
                --container-image-name "ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
            fi

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Print deployment URL
        run: echo "✅ Deployed to https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
